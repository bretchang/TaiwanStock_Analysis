<!-- ============ 風格 1：賽博霓虹 FINMETRICS ============ -->
<style id="theme-finmetrics" media="all">
  :root {
    --bg: #060912; --bg2: #0b1120;
    --panel: rgba(13, 21, 38, 0.72);
    --cyan: #00f0ff; --magenta: #ff2d95; --lime: #a6ff00; --amber: #ffb000; --violet: #b14dff;
    --txt: #d8e6f2; --dim: #6f86a3; --line: rgba(0, 240, 255, 0.16);
    --co-page: linear-gradient(180deg, var(--bg2), var(--bg));
    --co-surface: var(--panel);
    --co-surface2: rgba(255,255,255,0.03);
    --co-radius: 12px; --co-shadow: none;
    --co-border: 1px solid var(--line);
    --co-accent: var(--cyan); --co-accent2: var(--magenta); --co-good: var(--lime);
    --co-font: 'JetBrains Mono','Consolas',monospace;
    --co-title-font: 'Orbitron', sans-serif;
  }
  body {
    font-family: 'JetBrains Mono', 'Consolas', 'Courier New', monospace; color: var(--txt);
    background:
      radial-gradient(1200px 700px at 12% -10%, rgba(177, 77, 255, 0.10), transparent 60%),
      radial-gradient(1000px 600px at 100% 0%, rgba(0, 240, 255, 0.10), transparent 55%),
      linear-gradient(180deg, var(--bg2), var(--bg));
    background-attachment: fixed; min-height: 100vh;
  }
  .brand h1 { font-family:'Orbitron',sans-serif; background:linear-gradient(90deg,var(--cyan),var(--magenta)); -webkit-background-clip:text; background-clip:text; color:transparent; }
</style>

<!-- ============ 風格 2：霧面玻璃 GLASS ============ -->
<style id="theme-glass" media="not all">
  :root {
    --txt: #f3f5fb; --dim: rgba(233, 238, 250, 0.62); --line: rgba(255, 255, 255, 0.16);
    --glass: rgba(255, 255, 255, 0.09); --glass-2: rgba(255, 255, 255, 0.055);
    --accent: #7cf7ff; --accent2: #ff8fc8; --violet: #c4a6ff; --lime: #8af7c8; --amber: #ffd98a;
    --magenta: #ff9ecb; --cyan: #7cf7ff;
    --co-page: #1a1438;
    --co-surface: var(--glass); --co-surface2: var(--glass-2);
    --co-radius: 16px; --co-shadow: 0 8px 30px rgba(0,0,0,0.25);
    --co-border: 1px solid var(--line);
    --co-accent: var(--accent); --co-accent2: var(--accent2); --co-good: var(--lime);
  }
  body { font-family: 'Noto Sans TC', 'Sora', system-ui, sans-serif; color: var(--txt); background: #1a1438; min-height: 100vh; }
  .brand h1 { font-family:'Sora',sans-serif; font-weight:800; color:#fff; }
  .card { backdrop-filter: blur(8px); }
</style>

<!-- ============ 風格 3：簡約明亮 CLEAN ============ -->
<style id="theme-clean" media="not all">
  :root {
    --bg: #f4f6fb; --bg2: #eef1f8; --panel: #ffffff;
    --txt: #1c2333; --txt2: #3b4458; --dim: #8a93a8; --line: #e6e9f1; --line2: #eef1f7;
    --accent: #4f46e5; --accent-soft: #eef0ff; --teal: #0d9488; --amber: #d97706;
    --magenta: #e11d48; --lime: #16a34a; --cyan: #2563eb;
    --co-page: linear-gradient(180deg, var(--bg), var(--bg2));
    --co-surface: #ffffff; --co-surface2: #fafbfd;
    --co-radius: 14px; --co-shadow: 0 1px 2px rgba(20,28,54,0.04), 0 8px 24px rgba(20,28,54,0.06);
    --co-border: 1px solid var(--line);
    --co-accent: var(--accent); --co-accent2: var(--magenta); --co-good: var(--lime);
  }
  body { font-family: 'Noto Sans TC', 'Inter', system-ui, sans-serif; color: var(--txt);
    background: linear-gradient(180deg, var(--bg), var(--bg2)); background-attachment: fixed; min-height: 100vh; -webkit-font-smoothing: antialiased; }
  .brand h1 { font-family:'Inter',sans-serif; font-weight:800; color: var(--txt); }
</style>

<!-- ============ 風格 4：便當格 BENTO ============ -->
<style id="theme-bento" media="not all">
  :root {
    --bg: #eef1f6; --bg2: #e7ebf2; --card: #ffffff;
    --txt: #1b2333; --dim: #6b7585; --line: #e4e8ef; --line2: #eceff4;
    --accent: #4f46e5; --accent2: #ec4899; --magenta: #f43f5e; --lime: #0d9488; --cyan: #4f46e5;
    --co-page: linear-gradient(180deg, var(--bg), var(--bg2));
    --co-surface: var(--card); --co-surface2: #f7f9fc;
    --co-radius: 18px; --co-shadow: 0 6px 22px rgba(28, 38, 60, 0.07), 0 1px 3px rgba(28, 38, 60, 0.05);
    --co-border: 1px solid var(--line);
    --co-accent: var(--accent); --co-accent2: var(--accent2); --co-good: var(--lime);
  }
  body { font-family: 'Noto Sans TC', 'Space Grotesk', system-ui, sans-serif; color: var(--txt);
    background: linear-gradient(180deg, var(--bg), var(--bg2)); background-attachment: fixed; min-height: 100vh; }
  .brand h1 { font-family:'Space Grotesk',sans-serif; font-weight:700; color: var(--txt); }
</style>

<!-- ============ 風格 5：新粗獷 NEUBRUTALISM ============ -->
<style id="theme-neu" media="not all">
  :root {
    --ink: #111111; --paper: #fef6e4; --panel: #ffffff;
    --txt: #111111; --dim: #5b5b5b; --line: #111111;
    --yellow: #ffd23f; --pink: #ff7ac6; --cyanb: #5ce1e6; --green: #7be07b;
    --accent: #4d5bf9; --accent2: #ff5470; --magenta: #ff2e63; --lime: #0bb36b; --cyan: #4d5bf9;
    --co-page: var(--paper);
    --co-surface: #ffffff; --co-surface2: #ffffff;
    --co-radius: 0px; --co-shadow: 4px 4px 0 var(--ink);
    --co-border: 2px solid var(--ink);
    --co-accent: var(--accent); --co-accent2: var(--accent2); --co-good: #0a8f56;
  }
  body { font-family: 'Noto Sans TC', 'Space Mono', system-ui, sans-serif; color: var(--txt);
    background: var(--paper);
    background-image: linear-gradient(rgba(17,17,17,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(17,17,17,0.05) 1px, transparent 1px);
    background-size: 32px 32px; min-height: 100vh; }
  .brand h1 { font-family:'Archivo Black',sans-serif; color: var(--ink); text-transform: uppercase; }
  .card { box-shadow: var(--co-shadow); }
  .seg button.active, .chip.on, .btn { box-shadow: 2px 2px 0 var(--ink); }
</style>

<!-- ============ 共用版面元件（全風格共用，使用 CSS 變數） ============ -->
<style id="layout-shared" media="all">
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { overflow-x: clip; }
  body { overflow-x: clip; max-width: 100%; }
  a { color: inherit; }

  .wrap { position: relative; z-index: 1; max-width: 1500px; margin: 0 auto; padding: 18px 18px 80px; }

  header.topbar { display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; padding: 14px 4px 18px; border-bottom: var(--co-border); margin-bottom: 16px; }
  .brand { display: flex; flex-direction: column; gap: 4px; margin-right: auto; }
  .brand h1 { margin: 0; font-size: 22px; letter-spacing: .5px; line-height: 1.2; }
  .brand .sub { font-size: 12px; color: var(--dim); letter-spacing: .3px; line-height: 1.5; }

  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-bottom: 14px; }
  .ctl { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .ctl label { font-size: 10px; color: var(--dim); letter-spacing: 1px; text-transform: uppercase; }
  select, input[type="text"] {
    background: var(--co-surface2); color: var(--txt); border: var(--co-border); border-radius: 8px;
    padding: 8px 10px; font-size: 13px; font-family: inherit; max-width: 100%;
  }
  select:focus, input:focus { outline: none; border-color: var(--co-accent); }
  .theme-ctl { margin-left: auto; }

  .stat { font-size: 12px; color: var(--dim); }
  .stat b { color: var(--co-accent); }

  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 11px; color: var(--dim); margin: 4px 2px 18px; align-items: center; }
  .legend .flag { font-size: 14px; }

  /* group section */
  .group { margin-bottom: 26px; }
  .group-head { display: flex; align-items: center; gap: 12px; margin: 0 2px 12px; }
  .group-head h2 { font-family: var(--co-title-font, inherit); font-size: 15px; font-weight: 700; margin: 0; color: var(--txt); letter-spacing: .5px; }
  .group-head .bar { flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }
  .group-head .count { font-size: 11px; color: var(--dim); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 14px; }

  .card { background: var(--co-surface); border: var(--co-border); border-radius: var(--co-radius); box-shadow: var(--co-shadow); padding: 14px 16px; overflow: hidden; }
  .card-top { display: flex; align-items: flex-start; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .card-sub { font-size: 16px; font-weight: 700; color: var(--txt); margin-right: auto; }
  .card-cat { font-size: 10px; color: var(--dim); letter-spacing: 1px; }

  .tag { font-size: 10px; padding: 2px 8px; border-radius: 999px; border: 1px solid; white-space: nowrap; }
  .tag.lead { color: var(--co-accent2); border-color: var(--co-accent2); }
  .tag.tw { color: var(--co-good); border-color: var(--co-good); }

  table.peers { width: 100%; border-collapse: collapse; font-size: 12px; margin: 4px 0 10px; }
  table.peers td { padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.peers tr:last-child td { border-bottom: none; }
  .reg { white-space: nowrap; font-weight: 700; width: 64px; }
  .reg .flag { font-size: 13px; margin-right: 3px; }
  .co { color: var(--txt); font-weight: 600; }
  .co .tic { color: var(--dim); font-weight: 400; font-size: 11px; margin-left: 4px; }
  .co .crown { color: var(--amber, #ffb000); margin-left: 4px; }
  .co-biz { display: block; color: var(--dim); font-weight: 400; font-size: 11px; margin-top: 2px; }
  .none { color: var(--dim); font-style: italic; }

  .kv { font-size: 12px; line-height: 1.55; margin: 6px 0 0; }
  .kv .k { color: var(--co-accent); font-weight: 700; margin-right: 6px; }
  .kv .rel { color: var(--txt); }
  .kv.rel-row { border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 8px; }
  .kv .k.warn { color: var(--co-accent2); }

  .empty-state { text-align: center; color: var(--dim); padding: 60px 20px; }

  @media (max-width: 720px) {
    .brand h1 { font-size: 18px; }
    .grid { grid-template-columns: 1fr; }
    .theme-ctl { margin-left: 0; width: 100%; }
    .theme-ctl select { width: 100%; }
  }
</style>

<script>
  // 啟動前先套用使用者上次選的風格，避免閃爍
  (function () {
    try {
      var ids = { finmetrics: 'theme-finmetrics', glass: 'theme-glass', clean: 'theme-clean', bento: 'theme-bento', neu: 'theme-neu' };
      var t = localStorage.getItem('finmetrics_theme') || 'finmetrics';
      if (!ids[t]) t = 'finmetrics';
      Object.keys(ids).forEach(function (n) {
        var el = document.getElementById(ids[n]);
        if (el) el.media = (n === t ? 'all' : 'not all');
      });
    } catch (e) {}
  })();
</script>
</head>

const $ = (s) => document.querySelector(s);
const FLAG = { tw:'🇹🇼', us:'🇺🇸', jp:'🇯🇵', kr:'🇰🇷' };
const REGION_LABEL = { tw:'台灣', us:'美國', jp:'日本', kr:'韓國', other:'其他' };

const state = { cat:'', lead:'', q:'' };

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function peerRow(region, info){
  if (!info) {
    return `<tr><td class="reg"><span class="flag">${FLAG[region]}</span>${REGION_LABEL[region]}</td><td class="none">—（無對應/不適用）</td></tr>`;
  }
  const crown = info.lead ? '<span class="crown" title="該細產業全球龍頭">★</span>' : '';
  const id = info.id ? `${esc(info.id)} ` : '';
  const tic = info.tic ? `<span class="tic">${esc(info.tic)}</span>` : '';
  return `<tr>
    <td class="reg"><span class="flag">${FLAG[region]}</span>${REGION_LABEL[region]}</td>
    <td><span class="co">${id}${esc(info.name)}${tic}${crown}</span><span class="co-biz">${esc(info.biz||'')}</span></td>
  </tr>`;
}

  return `<div class="card">
    <div class="card-top">
      <span class="card-sub">${esc(d.sub)}</span>
      <span class="card-cat">${esc(d.cat)}</span>
    </div>
    <div class="card-top" style="margin-top:-4px;gap:6px;">${leadTag}${twTag}</div>
    <table class="peers">
      ${peerRow('tw', d.tw)}
      ${peerRow('us', d.us)}
      ${peerRow('jp', d.jp)}
      ${peerRow('kr', d.kr)}
    </table>
    <div class="kv rel-row"><span class="k warn">關係</span><span class="rel">${esc(d.rel)}</span></div>
  </div>`;
}

function passFilter(d){
  if (state.cat && d.cat !== state.cat) return false;
  if (state.lead && d.lead !== state.lead) return false;
  if (state.q) {
    const q = state.q.toLowerCase();
    const hay = [d.cat, d.sub, d.rel, d.tw&&d.tw.name, d.tw&&d.tw.id, d.us&&d.us.name, d.jp&&d.jp.name, d.kr&&d.kr.name]
      .filter(Boolean).join(' ').toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function render(){
  const rows = DATA.filter(passFilter);
  const content = $('#content');
  if (!rows.length){
    content.innerHTML = '<div class="empty-state">查無符合條件的細產業。</div>';
    $('#statBox').innerHTML = `共 <b>0</b> 項`;
    return;
  }
  // group by cat
  const cats = [];
  const map = {};
  rows.forEach(d => { if(!map[d.cat]){ map[d.cat]=[]; cats.push(d.cat);} map[d.cat].push(d); });
  let html = '';
  cats.forEach(c => {
    const list = map[c];
    html += `<section class="group">
      <div class="group-head"><h2>${esc(c)}</h2><div class="bar"></div><span class="count">${list.length} 項</span></div>
      <div class="grid">${list.map(cardHtml).join('')}</div>
    </section>`;
  });
  content.innerHTML = html;
  const twLead = DATA.filter(d=>d.lead==='tw').length;
  $('#statBox').innerHTML = `顯示 <b>${rows.length}</b> / ${DATA.length} 項　台股稱霸 <b>${twLead}</b> 項`;
}

/* ---------------- 介面風格切換 ---------------- */
const THEME_STYLE_IDS = { finmetrics:'theme-finmetrics', glass:'theme-glass', clean:'theme-clean', bento:'theme-bento', neu:'theme-neu' };
function applyTheme(name){
  if (!THEME_STYLE_IDS[name]) name = 'finmetrics';
  Object.keys(THEME_STYLE_IDS).forEach(n => {
    const el = document.getElementById(THEME_STYLE_IDS[n]);
    if (el) el.media = (n === name ? 'all' : 'not all');
  });
  const sel = $('#themeSel'); if (sel) sel.value = name;
  try { localStorage.setItem('finmetrics_theme', name); } catch(e){}
}
function initTheme(){
  let saved = 'finmetrics';
  try { saved = localStorage.getItem('finmetrics_theme') || 'finmetrics'; } catch(e){}
  applyTheme(saved);
}

/* ---------------- 控制項 ---------------- */
function fillCats(){
  const sel = $('#catSel');
  const cats = [];
  DATA.forEach(d => { if(!cats.includes(d.cat)) cats.push(d.cat); });
  cats.forEach(c => { const o=document.createElement('option'); o.value=c; o.textContent=c; sel.appendChild(o); });
}
function bindControls(){
  $('#catSel').addEventListener('change', e => { state.cat = e.target.value; render(); });
  $('#leadSel').addEventListener('change', e => { state.lead = e.target.value; render(); });
  $('#searchBox').addEventListener('input', e => { state.q = e.target.value.trim(); render(); });
  $('#themeSel').addEventListener('change', e => applyTheme(e.target.value));
}

function init(){
  initTheme();
  fillCats();
  bindControls();
  render();
}
init();
</script>
</body>
</html>
